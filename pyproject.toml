[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arb-market-scanner"
version = "0.1.0"
description = "Read-only prediction-market ingestion foundation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
arb-scan = "arb.cli:main"

[tool.setuptools.packages.find]
include = ["arb*"]

[tool.setuptools.package-data]
arb = ["fixtures/*.json"]
